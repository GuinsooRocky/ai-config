<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    /* 底稿来自 codex 侧 longform-html/assets/learning-handbook-template.html，
       在此加了暗色 token 与反讲专属组件（badge-prd / modal-tag / warn / qrow / big-card / plat-*）。
       反讲 HTML 必须暗亮双模，原底稿是 light-only，改动集中在 :root 的第二组变量。 */
    :root {
      --ink:#22221f; --muted:#67665f; --paper:#eceae4; --card:#faf9f5; --line:#c9c6bc;
      --green:#34564e; --green-2:#e9efec; --orange:#a63d2f; --orange-2:#f3e9e5;
      --blue:#294967; --blue-2:#e9eef2; --code:#ebe6db;--code-fg:#7d5a3c; --diagram:#1f2927; --diagram-ink:#dfe9e5;
      --radius:4px; --content:1120px;
    }
    @media (prefers-color-scheme:dark) { :root {
      --ink:#e7e5df; --muted:#9b988e; --paper:#1a1a17; --card:#232320; --line:#3b3a34;
      --green:#4d7d70; --green-2:#1f2b28; --orange:#d4795f; --orange-2:#2d211d;
      --blue:#7ea6c8; --blue-2:#1c2530; --code:#2b2a25;--code-fg:#c6a07c; --diagram:#121817; --diagram-ink:#cfdcd8;
    } }
    [data-theme="dark"] {
      --ink:#e7e5df; --muted:#9b988e; --paper:#1a1a17; --card:#232320; --line:#3b3a34;
      --green:#4d7d70; --green-2:#1f2b28; --orange:#d4795f; --orange-2:#2d211d;
      --blue:#7ea6c8; --blue-2:#1c2530; --code:#2b2a25;--code-fg:#c6a07c; --diagram:#121817; --diagram-ink:#cfdcd8;
    }
    [data-theme="light"] {
      --ink:#22221f; --muted:#67665f; --paper:#eceae4; --card:#faf9f5; --line:#c9c6bc;
      --green:#34564e; --green-2:#e9efec; --orange:#a63d2f; --orange-2:#f3e9e5;
      --blue:#294967; --blue-2:#e9eef2; --code:#ebe6db; --diagram:#1f2927; --diagram-ink:#dfe9e5;
    }
    * { box-sizing:border-box; } html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; font-size:18px; line-height:1.78; letter-spacing:.01em; }
    a { color:var(--blue); text-underline-offset:3px; } a:hover { color:var(--orange); }
    .progress { position:fixed; z-index:20; top:0; left:0; width:0; height:4px; background:var(--orange); }
    header { padding:22px 0 18px; background:var(--paper); border-bottom:1px solid var(--line); }
    .hero,.layout { width:100%; display:grid; grid-template-columns:190px minmax(0,1fr); gap:32px; padding:0 32px 0 20px; }
    h1 { width:min(var(--content),100%); margin:0; font-family:ui-serif,"Songti SC","STSong",serif; font-size:clamp(28px,calc(2.4vw + 2px),36px); line-height:1.2; letter-spacing:-.02em; font-weight:800; grid-column:2; justify-self:center; }
    .theme-toggle { position:fixed; z-index:21; right:18px; top:14px; padding:5px 11px; color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:var(--radius); font-size:13px; cursor:pointer; }
    nav { position:sticky; top:28px; align-self:start; max-height:calc(100vh - 56px); padding:36px 0; overflow:auto; font-size:15px; }
    nav strong { display:block; margin-bottom:12px; color:var(--muted); font-size:14px; letter-spacing:.12em; }
    nav a { display:block; padding:5px 0 5px 12px; color:var(--muted); border-left:1px solid var(--line); text-decoration:none; }
    nav a:hover { color:var(--ink); border-color:var(--orange); }
    main { width:min(var(--content),100%); justify-self:center; padding:52px 0 120px; }
    section { margin-bottom:82px; scroll-margin-top:24px; }
    h2 { margin:0 0 20px; font-family:ui-serif,"Songti SC","STSong",serif; font-size:clamp(28px,calc(2.4vw + 2px),36px); line-height:1.25; letter-spacing:-.025em; }
    h3 { margin:42px 0 12px; font-size:22px; line-height:1.4; } p { margin:12px 0; } ul,ol { padding-left:1.35em; } li { margin:6px 0; }
    .section-kicker { margin-bottom:10px; color:var(--orange); font-size:14px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    .card { margin:24px 0; padding:24px; background:var(--card); border:1px solid var(--line); border-top:3px solid var(--ink); border-radius:var(--radius); }
    .cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:24px 0; } .cards .card { margin:0; }
    .diagram { margin:28px 0; padding:24px; overflow-x:auto; color:var(--diagram-ink); background:var(--diagram); font:17px/1.8 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; white-space:pre; }
    .matrix { width:100%; margin:22px 0; border-collapse:collapse; background:var(--card); box-shadow:0 0 0 1px var(--line); }
    .matrix th,.matrix td { padding:13px 14px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; font-size:16px; } .matrix th { color:#fff; background:var(--green); } .matrix tr:last-child td { border-bottom:0; }
    .matrix code { overflow-wrap:anywhere; }
    .matrix th:first-child,.matrix td:first-child { min-width:7em; }
    .matrix td { overflow-wrap:break-word; }
    .shot { margin:28px 0; }
    .shot-wrap { position:relative; line-height:0; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
    .shot-wrap img { display:block; width:100%; height:auto; }
    .shot .mk { position:absolute; box-sizing:border-box; }
    .shot .mk-box { border:2px solid var(--orange); border-radius:3px; }
    .shot .mk-line { left:0; right:0; height:0; border-top:3px dashed var(--orange); }
    .shot .mk-no { position:absolute; top:-14px; left:-14px; display:grid; place-items:center; width:27px; height:27px; color:#fff; background:var(--orange); border-radius:50%; font:800 15px/1 -apple-system,sans-serif; }
    .shot .mk-line .mk-no { top:-14px; left:auto; right:8px; }
    .shot figcaption { margin-top:12px; font-size:15.5px; line-height:1.7; color:var(--muted); }
    .shot figcaption b { color:var(--ink); }
    .shot figcaption .n { display:inline-grid; place-items:center; width:19px; height:19px; margin-right:5px; color:#fff; background:var(--orange); border-radius:50%; font:800 12px/1 -apple-system,sans-serif; vertical-align:-3px; }
    .steps { counter-reset:steps; list-style:none; padding:0; } .steps li { position:relative; margin:0; padding:0 0 28px 54px; }
    .steps li::before { counter-increment:steps; content:counter(steps); position:absolute; left:0; top:1px; display:grid; place-items:center; width:34px; height:34px; color:#fff; background:var(--orange); border-radius:50%; font-weight:800; }
    .steps li::after { content:""; position:absolute; left:16px; top:39px; bottom:5px; width:2px; background:var(--line); } .steps li:last-child::after { display:none; } .steps b { display:block; margin-bottom:4px; }
    code { color:var(--code-fg); font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; font-size:.92em; }

    /* ── 反讲专属组件（下游靠这些类名认结构，勿改类名）───────────────── */
    .badge-prd { display:inline-block; margin-left:8px; padding:2px 9px; color:#fff; background:var(--green); border-radius:var(--radius); font-family:-apple-system,sans-serif; font-size:13px; font-weight:600; letter-spacing:0; vertical-align:middle; }
    .modal-tag { color:var(--orange); font-size:.95em; font-weight:650; }
    .warn { margin:22px 0; padding:1px 0 1px 15px; border-left:3px solid var(--orange); }
    .warn b { color:var(--orange); }
    .qrow { margin:16px 0; padding:20px 22px; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--orange); border-radius:var(--radius); }
    .qrow .qid { color:var(--orange); font-size:19px; font-weight:800; }
    .qrow .src { color:var(--muted); font-size:14px; }
    .big-card { margin:26px 0; padding:26px 30px; background:var(--card); border:1px solid var(--line); border-top:3px solid var(--orange); border-radius:var(--radius); font-size:20px; font-weight:700; line-height:1.6; text-align:center; }
    .plat-pc,.plat-mobile { font-size:16px; }
    .scope { margin:22px 0; padding:1px 0 1px 15px; border-left:3px solid var(--green); font-size:16px; }
    .sub { color:var(--muted); font-size:16px; }
    .done { color:var(--green); font-weight:700; } .todo { color:var(--orange); font-weight:700; }

    @media (max-width:900px) { .hero,.layout { display:block; width:min(760px,calc(100% - 30px)); padding:0; margin:0 auto; } nav { display:none; } main { width:100%; padding-top:48px; } .theme-toggle { top:auto; bottom:16px; } }
    @media (max-width:620px) { header { padding:18px 0 15px; } h1 { font-size:30px; } .card,.qrow { padding:20px; } .cards { grid-template-columns:1fr; } .matrix { display:block; overflow-x:auto; } .big-card { padding:28px 20px; font-size:19px; } }
    @media print { body { background:#fff; color:#000; } .progress,nav,.theme-toggle { display:none; } .layout { display:block; width:100%; } header,main { padding:24px; } section { break-inside:auto; margin-bottom:54px; } .warn,.qrow,.card { break-inside:avoid; } a { color:#000; } }
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <button class="theme-toggle" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">切换深浅色</button>
  <header><div class="hero"><h1>{{TITLE}}</h1></div></header>
  <div class="layout">
    <nav aria-label="目录"><strong>阅读地图</strong><!-- <a href="#s-3-1">§3.1 创建与标价</a> 每项必须指向真实 section 的 id --></nav>
    <main>
      <!-- 每节一个 <section id="s-X-X">，h2 里带 <span class="badge-prd">§X.X</span>。
           PRD 矛盾用 .warn，弹窗编号用 .modal-tag，文末 P0 待决策用 .qrow。 -->
    </main>
  </div>
  <script>
    const progress = document.getElementById('progress');
    const updateProgress = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      progress.style.width = `${Math.min(100, Math.max(0, max > 0 ? window.scrollY / max * 100 : 0))}%`;
    };
    window.addEventListener('scroll', updateProgress, { passive:true }); updateProgress();
  </script>
</body>
</html>
